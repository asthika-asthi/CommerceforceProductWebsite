<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start a project | Contact Digital-tek</title>
<meta name="description" content="Tell us about your project. Free, no-obligation chat about AI automation, websites, SEO or content.">
<link rel="canonical" href="https://digital-tek.co.uk/contact/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Digital-tek">
<meta property="og:title" content="Start a project | Contact Digital-tek">
<meta property="og:description" content="Tell us about your project. Free, no-obligation chat about AI automation, websites, SEO or content.">
<meta property="og:url" content="https://digital-tek.co.uk/contact/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("dt-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main" class="page-enter">
<div class="wrap">
<div class="page-header"><span class="eyebrow"><span class="dot"></span>Contact</span>
<h1>Let's talk about <em>your project</em></h1>
<p class="lede">Tell us a little about what you need. It's a free, no-obligation chat and we reply within one working day.</p></div>
<section style="padding-top:24px"><div class="contact-grid">
<form id="contact-form" novalidate>
<label>Name <input name="name" autocomplete="name" required aria-describedby="err-name"><span class="err" id="err-name" role="alert"></span></label>
<label>Email <input name="email" type="email" autocomplete="email" required aria-describedby="err-email"><span class="err" id="err-email" role="alert"></span></label>
<label>Phone (optional) <input name="phone" type="tel" autocomplete="tel"></label>
<label>Company <input name="company" autocomplete="organization"></label>
<label>Service of interest <select name="service" required aria-describedby="err-service" data-render="service-options"></select><span class="err" id="err-service" role="alert"></span></label>
<label>Message <textarea name="message" required aria-describedby="err-message"></textarea><span class="err" id="err-message" role="alert"></span></label>
<label class="hp" aria-hidden="true">Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label>
<div><button class="btn btn-primary" type="submit">Send message →</button></div>
<p id="form-msg" role="status"></p>
</form>
<div class="card"><h3>Prefer to talk?</h3>
<p><a href="tel:+447484129061">+44 7484129061</a></p>
<p><a href="mailto:contact@digital-tek.co.uk">contact@digital-tek.co.uk</a></p>
<p>We usually reply within one working day.</p></div>
</div></section></div>
</main>
<div id="site-footer"></div>
<script src="/js/data.js"></script>
<script src="/js/site.js"></script>
</body>
</html>
