# nginx config for the Digital-tek parent site.
# Installed on the VPS as /etc/nginx/sites-available/digital-tek.conf
# (symlinked into sites-enabled/). It is separate from commerceforce-website.conf,
# and nginx chooses between them by the website name (server_name).
# Do NOT add "default_server" here: unmatched hosts must keep going to the
# first config (CommerceForce), exactly as they did before this site existed.

# Main site
server {
    listen 80;
    listen [::]:80;
    server_name digital-tek.co.uk www.digital-tek.co.uk;

    root /var/www/digital-tek;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        expires 1h;
        try_files $uri =404;
    }
}

# Other domains we own: send everything to the main site
server {
    listen 80;
    listen [::]:80;
    server_name digital-tek.info www.digital-tek.info digital-tek.store www.digital-tek.store;
    return 301 https://digital-tek.co.uk$request_uri;
}
