# nginx config for the Digital-tek parent site.
# Installed on the VPS as /etc/nginx/sites-available/digital-tek.conf
# (symlinked into sites-enabled/). It is separate from commerceforce-website.conf,
# and nginx chooses between them by the website name (server_name).
# Do NOT add "default_server" here: unmatched hosts must keep going to the
# first config (CommerceForce), exactly as they did before this site existed.

# Main site
server {
    server_name digital-tek.co.uk;

    root /var/www/digital-tek;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        expires 1h;
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/digital-tek.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/digital-tek.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

# Other domains we own: send everything to the main site
server {
    listen 80;
    listen [::]:80;
    server_name digital-tek.info www.digital-tek.info digital-tek.store www.digital-tek.store;
    return 301 https://digital-tek.co.uk$request_uri;
}

server {
    if ($host = www.digital-tek.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = digital-tek.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name digital-tek.co.uk www.digital-tek.co.uk;
    return 404; # managed by Certbot




}
# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.digital-tek.co.uk;
    ssl_certificate /etc/letsencrypt/live/digital-tek.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digital-tek.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://digital-tek.co.uk$request_uri;
}
